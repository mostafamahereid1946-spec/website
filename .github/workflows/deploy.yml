# Deploys the site to Cloudflare Pages (free) on every push.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Deploy to Cloudflare Pages

on:
  push:
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: corevia
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set yet — skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Prepare public files
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir dist
          rsync -a --exclude '.git' --exclude '.github' --exclude 'README.md' --exclude 'OMNI_PROMPTS.md' --exclude '.gitignore' ./ dist/

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 20

      - name: Create Pages project (first run only)
        if: steps.check.outputs.ready == 'true'
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch "$GITHUB_REF_NAME" || echo "Project already exists."

      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: npx --yes wrangler@3 pages deploy dist --project-name "$PROJECT" --branch "$GITHUB_REF_NAME" --commit-dirty=true
