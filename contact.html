<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contact — Corevia</title>
  <meta name="description" content="Start your project with Corevia. WhatsApp or call +974 3301 8108.">
  <meta name="theme-color" content="#050f14">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="Contact — Corevia">
  <meta property="og:description" content="Start your project with Corevia. WhatsApp or call +974 3301 8108.">
  <meta property="og:image" content="assets/img/og-card.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="importmap">{"imports":{"three":"./assets/vendor/three/three.module.js","three/addons/":"./assets/vendor/three/addons/"}}</script>
</head>
<body data-page="contact">
<main>
  <section class="hero hero-sub">
    <canvas class="hero3d" data-variant="logo" aria-hidden="true"></canvas>
    <div class="wrap">
      <div class="hero-copy">
        <div class="eyebrow" data-hero-fade>Contact</div>
        <h1 class="display" data-split>Let’s <span class="grad">talk.</span></h1>
        <p class="lead" data-hero-fade>Tell us about your project. The quickest way is WhatsApp — the form below opens a chat with your details ready to send.</p>
        
      </div>
    </div>
  </section>
  <section class="section" style="padding-top:20px">
    <div class="wrap contact-grid">
      <form class="glass form" id="cf" data-scale-in>
        <div class="two">
          <div class="field"><label for="n">Your name</label><input id="n" name="name" required autocomplete="name" placeholder="Your name"></div>
          <div class="field"><label for="co">Company (optional)</label><input id="co" name="company" autocomplete="organization" placeholder="Company"></div>
        </div>
        <div class="field"><label for="sv">Service</label><select id="sv" name="service"></select></div>
        <div class="field"><label for="b">Budget</label>
          <select id="b" name="budget"><option>Not sure yet</option><option>Small</option><option>Medium</option><option>Large</option></select></div>
        <div class="field"><label for="m">Tell us about it</label><textarea id="m" name="message" required placeholder="What do you want to make? Any deadline?"></textarea></div>
        <div class="btn-row"><button class="btn" type="submit">Send on WhatsApp <span class="arr"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button></div>
      </form>
      <aside class="glass cinfo" data-scale-in>
        <div class="eyebrow">Direct</div>
        <a class="cline" href="https://wa.me/97433018108" target="_blank" rel="noopener"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M4 5h16v11H9l-5 4z"/></svg></span><span><small>WhatsApp</small><strong>Chat now</strong></span></a>
        <a class="cline" href="tel:+97433018108"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 005 5L15 12l5 2v4a2 2 0 01-2 2A16 16 0 013 5a2 2 0 012-2z"/></svg></span><span><small>Phone</small><strong>+974 3301 8108</strong></span></a>
        <div class="cline"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M12 21s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></span><span><small>Based in</small><strong>Doha, Qatar · working worldwide</strong></span></div>
        <div style="margin-top:auto;padding-top:20px;border-top:1px solid var(--line-2)">
          <p class="muted" style="margin:0">We reply fast — usually the same day.</p>
        </div>
      </aside>
    </div>
  </section>
</main>

<script src="assets/vendor/lenis.min.js"></script>
<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/vendor/ScrollTrigger.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/projects.js"></script>
<script src="assets/js/bg.js"></script>
<script>
  (function () {
    const sel = document.getElementById("sv");
    sel.innerHTML = COREVIA.services.map(s => `<option value="${s.id}">${s.title}</option>`).join("") + `<option value="other">Something else</option>`;
    const pre = new URLSearchParams(location.search).get("service");
    if (pre && [...sel.options].some(o => o.value === pre)) sel.value = pre;
    document.getElementById("cf").addEventListener("submit", e => {
      e.preventDefault();
      const f = e.target, svc = sel.options[sel.selectedIndex].text;
      const msg = `Hi Corevia! I'm ${f.name.value.trim()}${f.company.value.trim() ? " from " + f.company.value.trim() : ""}.\nService: ${svc}\nBudget: ${f.budget.value}\n\n${f.message.value.trim()}`;
      window.open(window.coreviaWA(msg), "_blank", "noopener");
    });
  })();</script>
<script src="assets/js/main.js"></script>

<script type="module" src="assets/js/hero3d.js"></script>
</body>
</html>
