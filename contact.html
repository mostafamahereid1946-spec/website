<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contact — Corevia</title>
  <meta name="description" content="Start your project with Corevia. Chat on WhatsApp with our Qatar or Egypt office.">
  <meta name="theme-color" content="#050f14">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="Contact — Corevia">
  <meta property="og:description" content="Start your project with Corevia. Chat on WhatsApp with our Qatar or Egypt office.">
  <meta property="og:image" content="assets/img/og-card.svg">
  <link rel="preload" href="assets/fonts/unbounded-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/sora-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="importmap">{"imports":{"three":"./assets/vendor/three/three.module.js","three/addons/":"./assets/vendor/three/addons/"}}</script>
</head>
<body data-page="contact">
<main>
  <section class="hero hero-sub">
    <canvas class="hero3d" data-variant="logo" aria-hidden="true"></canvas>
    <div class="wrap">
      <div class="hero-copy">
        <div class="eyebrow" data-hero-fade>Contact</div>
        <h1 class="display" data-split>Let’s <span class="grad">talk.</span></h1>
        <p class="lead" data-hero-fade>Tell us about your project. The quickest way is WhatsApp — the form below opens a chat with your details ready to send.</p>
        
      </div>
    </div>
  </section>
  <section class="section" style="padding-top:20px">
    <div class="wrap">
      <div class="offices" id="offices" data-reveal="stagger"></div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="wrap" style="max-width:900px">
      <div class="eyebrow">Send a message</div>
      <h2 class="h2" data-split style="margin-bottom:34px">Tell us about <span class="grad">your project</span></h2>
      <form class="glass form" id="cf" data-scale-in>
        <div class="two">
          <div class="field"><label for="n">Your name</label><input id="n" name="name" required autocomplete="name" placeholder="Your name"></div>
          <div class="field"><label for="co">Company (optional)</label><input id="co" name="company" autocomplete="organization" placeholder="Company"></div>
        </div>
        <div class="two">
          <div class="field"><label for="of">Send to</label><select id="of" name="office"></select></div>
          <div class="field"><label for="sv">Service</label><select id="sv" name="service"></select></div>
        </div>
        <div class="field"><label for="b">Budget</label>
          <select id="b" name="budget"><option>Not sure yet</option><option>Small</option><option>Medium</option><option>Large</option></select></div>
        <div class="field"><label for="m">Tell us about it</label><textarea id="m" name="message" required placeholder="What do you want to make? Any deadline?"></textarea></div>
        <div class="btn-row"><button class="btn" type="submit">Send on WhatsApp <span class="arr"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button></div>
      </form>
    </div>
  </section>
</main>

<script src="assets/vendor/lenis.min.js"></script>
<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/vendor/ScrollTrigger.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/projects.js"></script>
<script src="assets/js/bg.js"></script>
<script>
  (function () {
    const C = COREVIA, wa = d => `https://wa.me/${d}`;
    const waIcon = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm0 18.2a8.2 8.2 0 01-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1112 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 01-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 00-.7.3 3 3 0 00-.9 2.2 5.2 5.2 0 001.1 2.7 11.8 11.8 0 004.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 001.8-1.2 2.2 2.2 0 00.1-1.3c0-.1-.2-.2-.4-.3z"/></svg>';
    document.getElementById("offices").innerHTML = C.offices.map(o => `
      <article class="glass spot office" data-tilt="5">
        <div class="office-top"><span class="cc big">${o.id.toUpperCase()}</span><div><h3>${o.country}</h3><span class="office-label">${o.label}</span></div></div>
        <a class="office-phone" href="tel:+${o.whatsapp}">${o.phone}</a>
        <div class="btn-row">
          <a class="btn wa" href="${wa(o.whatsapp)}?text=${encodeURIComponent("Hi Corevia!")}" target="_blank" rel="noopener">${waIcon} WhatsApp</a>
          <a class="btn ghost" href="tel:+${o.whatsapp}">Call</a>
        </div>
        <div class="pay">
          <div class="label">We accept · ${o.currency}</div>
          <div class="pay-list">${o.payments.map(p => `<span>${p}</span>`).join("")}</div>
        </div>
      </article>`).join("");

    const of = document.getElementById("of");
    of.innerHTML = C.offices.map(o => `<option value="${o.id}">${o.country} — ${o.phone}</option>`).join("");
    const sel = document.getElementById("sv");
    sel.innerHTML = C.services.map(s => `<option value="${s.id}">${s.title}</option>`).join("") + `<option value="other">Something else</option>`;
    const q = new URLSearchParams(location.search);
    if (q.get("service") && [...sel.options].some(o => o.value === q.get("service"))) sel.value = q.get("service");
    if (q.get("office") && [...of.options].some(o => o.value === q.get("office"))) of.value = q.get("office");
    document.getElementById("cf").addEventListener("submit", e => {
      e.preventDefault();
      const f = e.target, svc = sel.options[sel.selectedIndex].text;
      const msg = `Hi Corevia! I'm ${f.name.value.trim()}${f.company.value.trim() ? " from " + f.company.value.trim() : ""}.\nService: ${svc}\nBudget: ${f.budget.value}\n\n${f.message.value.trim()}`;
      window.open(window.coreviaWA(msg, of.value), "_blank", "noopener");
    });
  })();</script>
<script src="assets/js/main.js"></script>

<script type="module" src="assets/js/hero3d.js"></script>
</body>
</html>
